[package]
name = "fsv-tui"
description = "fsv main TUI (list / detail / search / write modals)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["site"]
# Bind list columns, row cells, sort labels and list meta to `fsv_api::site`.
# Without it the TUI uses the fallback columns Python shows when the site
# helpers return nothing.
site = ["dep:fsv-api"]

[dependencies]
fsv-py.workspace = true
fsv-core.workspace = true
fsv-api = { workspace = true, optional = true }
serde_json.workspace = true
jiff.workspace = true
unicode-width.workspace = true
ratatui.workspace = true
crossterm.workspace = true
