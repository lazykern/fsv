[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2026.5.29"
edition = "2024"
license = "MIT"
authors = ["Phusit Somboonyingsuk"]
rust-version = "1.88"

[workspace.dependencies]
fsv-py = { path = "crates/fsv-py" }
fsv-core = { path = "crates/fsv-core" }
fsv-forms = { path = "crates/fsv-forms" }
fsv-api = { path = "crates/fsv-api" }
fsv-flows = { path = "crates/fsv-flows" }
fsv-views = { path = "crates/fsv-views" }
fsv-formui = { path = "crates/fsv-formui" }
fsv-tui = { path = "crates/fsv-tui" }
fsv-completion = { path = "crates/fsv-completion" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
regex = "1"
fancy-regex = "0.20"
once_cell = "1"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.9"
jiff = "0.2"
unicode-normalization = "0.1"
unicode-width = "0.2"
html-escape = "0.2"
percent-encoding = "2"
url = "2"
tempfile = "3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "gzip"] }
tungstenite = "0.30"
argon2 = "0.5"
aes-gcm = "0.10"
rpassword = "7"
crossterm = "0.29"
ratatui = "0.30"
clap = { version = "4", features = ["derive", "env", "wrap_help", "string"] }
yaml-rust2 = "0.13"
csv = "1"
dirs = "6"
dunce = "1"
which = "8"
mime_guess = "2"
proptest = "1"
caseless = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
